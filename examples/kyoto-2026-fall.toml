# 時限ごとの時間帯
[time_slots]
"1" = { start = "08:45", end = "10:15" }
"2" = { start = "10:30", end = "12:00" }
"lunch" = { start = "12:00", end = "13:15" }
"3" = { start = "13:15", end = "14:45" }
"4" = { start = "15:00", end = "16:30" }
"5" = { start = "16:45", end = "18:15" }

# 振替日
[[day_overrides]]
date = 2026-10-15
use_weekday = "mon"
all_day_event_title = "月曜授業に振替"

[[day_overrides]]
date = 2026-11-26
use_weekday = "tue"
all_day_event_title = "火曜授業に振替"

